version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: farmacitas-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./Backend
    container_name: farmacitas-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/gestonhospitalaria
      JWT_SECRET: farmacitas2026
    depends_on:
      - mongo

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: farmacitas-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
