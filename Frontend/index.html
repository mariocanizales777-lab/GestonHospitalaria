<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FarmaCitas Fantásticas - Agendar Cita</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar">
    <h2>FarmaCitas <span>Fantásticas</span></h2>
    <div class="user-badge">Laura Martínez (Paciente Premium)</div>
  </header>

  <main class="container">
    <section class="booking-section">
      <h1>Agendar nueva cita médica</h1>
      <p>Seleccione el día de su preferencia y una de las horas disponibles para confirmar su asistencia.</p>
      
      <h3>Horarios Disponibles</h3>
      <div class="legend">
        <span class="badge disponible">Disponible</span>
        <span class="badge expira">Próximo a expirar (Bloqueo 10 min)</span>
        <span class="badge ocupado">Ocupado</span>
      </div>

      <div class="slots-grid" id="slots-container">
        <!-- Carga desde JS -->
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
