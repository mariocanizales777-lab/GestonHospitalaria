name: CI/CD FarmaCitas
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
        env:
          JWT_SECRET: test_secret
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend a Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Deploy Frontend a Vercel
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
      - name: Esperar a que el despliegue esté listo
        run: sleep 60
  owasp-zap:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Escaneo baseline OWASP ZAP (via Docker)
        run: |
          mkdir -p zap-report
          chmod -R 777 zap-report
          docker run --rm -v $(pwd)/zap-report:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t ${{ secrets.FRONTEND_URL }} \
            -r report_html.html \
            -x report_xml.xml \
            -a || true
          echo "--- Contenido de zap-report ---"
          ls -la zap-report
      - name: Guardar reporte de ZAP
        uses: actions/upload-artifact@v4
        with:
          name: reporte-owasp-zap
          path: zap-report/
  sonarcloud:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias y generar cobertura
        working-directory: Backend
        run: |
          npm install
          npm test
        env:
          JWT_SECRET: test_secret
      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
